name: queenbee_mobile
description: Application mobile offline-first de gestion apicole pour QueenBee.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Planned integrations from the design dossier. The initial shell uses
  # Flutter SDK primitives so it remains easy to run before the API exists.
  connectivity_plus: ^6.1.0
  dio: ^5.7.0
  drift: ^2.21.0
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  intl: ^0.20.3
  local_auth: ^2.3.0
  mobile_scanner: ^6.0.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
